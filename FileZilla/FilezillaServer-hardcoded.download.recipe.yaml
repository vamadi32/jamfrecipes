Description: "Downloads a hardcoded version of FileZilla Server for macOS (Apple Silicon) using hardcoded CDN URL."
Identifier: "com.github.vamadi32.download.FileZillaServer-hardcoded"
Input:
  NAME: FileZillaServer
  VERSION: 1.10.5
  URL: "https://dl2.cdn.filezilla-project.org/server/FileZilla_Server_%VERSION%_macos-arm64.pkg?h=CHbcwYo1tJitxSpAmpLK5Q&x=1754388644"
  FILENAME: "%NAME%-%VERSION%.pkg"

Process:
  - Processor: URLDownloader
    Arguments:
      url: "%URL%"
      filename: "%FILENAME%"
      destination_path: "%RECIPE_CACHE_DIR%/downloads"

  - Processor: EndOfCheckPhase

Description: "Fetches and renames FileZilla Server .pkg"
Identifier: "com.github.vamadi32.pkg.FileZillaServer-hardcoded"
ParentRecipe: "com.github.vamadi32.download.FileZillaServer-hardcoded"
MinimumVersion: "1.0.0"

Input:
  NAME: "FileZillaServer"
  version: "1.10.5"

Process:
  - Processor: PkgCopier
    Arguments:
      source_pkg: "%pathname%"
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.pkg"

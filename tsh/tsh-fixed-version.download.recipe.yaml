Description: Recipe description
Comment: tsh is now being bundled in Teleport. New versions missing in Changelog 
Identifier: com.github.vamadi32.download.tsh-fixed-version
MinimumVersion: '2.3'

Input:
  NAME: tsh
  MATCH_VERSION: '16.1.4'

Process:
- Processor: URLDownloader
  Arguments:
    url: 'https://cdn.teleport.dev/tsh-%MATCH_VERSION%.pkg'
    filename: '%NAME%-%MATCH_VERSION%.pkg'

- Processor: EndOfCheckPhase

- Processor: CodeSignatureVerifier
  Arguments:
    input_path: '%pathname%'
    expected_authority_names:
      - 'Developer ID Installer: Gravitational Inc. (QH8AA5B8UP)'
      - 'Developer ID Certification Authority'
      - 'Apple Root CA'